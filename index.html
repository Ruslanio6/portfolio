<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0E12" />
    <meta name="portfolio-ga4" content="G-5D5HVL7CSS" />
    <script>
      let savedTheme;
      try {
        savedTheme = localStorage.getItem('portfolio-theme');
      } catch { /* Follow the system theme when storage is unavailable. */ }
      const mobile = matchMedia('(width < 1024px)').matches;
      const light = savedTheme === 'light' || (savedTheme !== 'dark' && !matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      document.querySelector('meta[name="theme-color"]').content = light ? '#ffffff' : (mobile ? '#000000' : '#0F0E12');
    </script>
    <meta name="description" content="Продуктовый дизайнер мобильных приложений и веб-сервисов в финтех и b2c продуктах" />
    <title>Руслан Хашимов</title>
    <link rel="icon" href="/img/favicon/favicon.png?v=2" type="image/png" sizes="96x96" />
    <script>
      {
        const icon = document.querySelector('link[rel="icon"]');
        const lightHref = icon.getAttribute('href');
        const browserTheme = matchMedia('(prefers-color-scheme: dark)');
        const update = () => { icon.href = browserTheme.matches ? '/img/favicon/favicon-dark.png?v=2' : lightHref; };
        update();
        browserTheme.addEventListener('change', update);
      }
    </script>
    <script>
      try {
        if (localStorage.getItem('portfolio-language') === 'en') {
          document.documentElement.lang = 'en';
          document.title = 'Ruslan — Product Designer';
          document.querySelector('meta[name="description"]').content = 'Portfolio of Ruslan, a product designer. Alfa-Bank, CARDS, MTUCI, Sono, and UI-Kit Cards+.';
        }
      } catch { /* Use Russian when storage is unavailable. */ }
    </script>
    <script>document.documentElement.classList.add('accordion-ready');</script>
    <script>
      if (!/^[1-5]$/.test(new URLSearchParams(location.search).get('project') ?? '')) {
        document.documentElement.classList.add('home-loading');
        const projects = [['video-demo', 1087], ['sono', 1087], ['cards', 1087], ['ui-kit-cards', 2172], ['mtuci', 1086]];
        const sizes = matchMedia('(width < 1024px)').matches ? 'min(61.94vw, 33svh, 350px)' : '220px';
        projects.forEach(([project, width], index) => {
          const cover = document.createElement('link');
          const base = `portfolio-cases/${project}/artwork`;
          cover.rel = 'preload';
          cover.as = 'image';
          if (index === 0) cover.fetchPriority = 'high';
          cover.imageSrcset = [320, 640, 768, 960].map(size => `${base}-${size}.webp?v=2 ${size}w`)
            .concat(`${base}.webp?v=2 ${width}w`).join(', ');
          cover.imageSizes = sizes;
          document.head.append(cover);
        });
      }
    </script>
    <link rel="stylesheet" href="styles.css?v=mobile-project-meta-1" />
    <script src="accordion.js?v=system-theme-1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#works"><span data-i18n-lang="ru">Перейти к&nbsp;работам</span><span data-i18n-lang="en">Skip to work</span></a>
    <div id="header-root"></div>
    <div class="page"><main id="works" class="works"><div id="accordion-root" class="accordion-root"></div></main></div>
    <div class="home-skeleton" aria-hidden="true">
      <div class="home-skeleton__header">
        <div class="home-skeleton__identity"><span></span><span></span></div>
        <span class="home-skeleton__menu"></span>
      </div>
      <div class="home-skeleton__desktop">
        <div class="orbit-perspective"><div class="orbit-perspective__plane">
          <span class="home-skeleton__disc" style="--skeleton-angle: 72deg"></span>
          <span class="home-skeleton__disc" style="--skeleton-angle: 36deg"></span>
          <span class="home-skeleton__disc" style="--skeleton-angle: 0deg"></span>
          <span class="home-skeleton__disc" style="--skeleton-angle: -36deg"></span>
          <span class="home-skeleton__disc" style="--skeleton-angle: -72deg"></span>
        </div></div>
        <div class="home-skeleton__project"><span></span><span></span><span></span></div>
        <div class="home-skeleton__sections"><span></span><span></span><span></span></div>
      </div>
      <div class="home-skeleton__mobile">
        <div class="home-skeleton__copy"><span></span><span></span><span></span></div>
        <div class="home-skeleton__track"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="home-skeleton__contacts"><span></span><span></span><span></span></div>
      </div>
      <div class="home-skeleton__about" aria-hidden="true">
        <span class="home-skeleton__about-copy"></span><span class="home-skeleton__about-portrait"></span>
      </div>
      <div class="home-skeleton__gallery" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
